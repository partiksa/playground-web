<!doctype html>
<html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll po snímkach, ukážka</title>
<style>
  html,body{margin:0;background:#F6F3EE;font-family:system-ui,sans-serif;color:#15194A}
  .hero{height:400vh;position:relative}
  .hero canvas{position:sticky;top:0;display:block;width:100%;height:100vh;background:#F6F3EE}
  .after{height:100vh;display:grid;place-items:center;font-size:4vw}
</style>
<section class="hero" id="hero"><canvas id="c"></canvas></section>
<div class="after">Ďalšia sekcia</div>
<script type="module">
  import { scrollFrames } from './scroll-frames.js';
  scrollFrames({ canvas: document.getElementById('c'), section: document.getElementById('hero'), dir: 'frames/', count: 120 });
</script>
</html>
