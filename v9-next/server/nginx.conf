# Nginx pre PLAYGROUND (Ploi site, web directory /www). Vložiť do site konfigurácie v Ploi
# namiesto Ploi bloku „location /“. PHP location (fastcgi) nechať, ako ho Ploi vygeneroval.

    index index.html;
    error_page 404 /404.html;
    client_max_body_size 20m;   # fotky v admine (12 MB) a príloha formulára (10 MB)

    # testovacia adresa sa nesmie dostať do Googlu
    set $pg_robots "";
    if ($host ~* "codx\.sk$") { set $pg_robots "noindex, nofollow"; }
    add_header X-Robots-Tag $pg_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # staré adresy WordPressu → nové stránky (301)
    include /home/playground/playground.codx.sk/v9-next/server/presmerovania.conf;

    location = / { return 301 /sk/$is_args$args; }

    # skryté súbory, zdrojové a pomocné súbory
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(md|map|sh|sql|log|lock|tmp)$ { deny all; }

    # dáta adminu: žiadne skripty, JSON vždy čerstvý
    location ^~ /data/ {
        location ~ /\. { deny all; }
        location ~* \.php$ { deny all; }
        location ~* \.json$ { add_header Cache-Control "no-store" always; add_header X-Robots-Tag $pg_robots always; }
        try_files $uri =404;
    }

    # admin: len index.php a api.php, ostatné PHP v admine nie
    location ~ ^/admin/(lib|config)\.php$ { deny all; }
    location = /admin { return 301 /admin/; }
    location = /admin/ { rewrite ^ /admin/index.php last; }

    # súbory Next.js s hashom v názve
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(webp|jpe?g|png|svg|ico|woff2?|mp4|glb|js|css)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Robots-Tag $pg_robots always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $pg_robots always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # priečinok bez lomky na konci → s lomkou (jedna adresa pre Google)
        if (-d $request_filename) { rewrite ^(.*[^/])$ $1/ permanent; }
        try_files $uri $uri/ =404;
    }
